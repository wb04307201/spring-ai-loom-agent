<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>灵梭登录 — 定稿 · A+B 组合</title>
<!-- 视觉参考稿：与 2026-08-05-login-redesign-design.md 配套。logo 用仓库相对路径，浏览器直接打开即可预览 -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #6366f1; --primary-hover: #4f46e5;
    --text-1: #1e293b; --text-2: #64748b; --text-3: #94a3b8;
    --bg: #f8fafc; --card: #ffffff; --border: #e2e8f0;
  }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: var(--bg); height: 100vh; color: var(--text-1);
    display: flex; flex-direction: column; position: relative; overflow: hidden;
  }
  .threads { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  /* 与主应用 .header 同款：60px 白顶栏 */
  .app-header {
    height: 60px; padding: 0 20px; background: var(--card);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0; position: relative; z-index: 1;
  }
  .app-header .left { display: flex; align-items: center; gap: 12px; }
  .app-header img { width: 40px; height: 40px; border-radius: 10px; object-fit: cover; }
  .app-header .title { font-size: 20px; font-weight: 700; letter-spacing: 1px; }
  .app-header .right { font-size: 13px; color: var(--text-3); }
  .main { flex: 1; display: flex; align-items: center; justify-content: center; }
  .login-card {
    position: relative; width: 100%; max-width: 400px; margin: 20px;
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    box-shadow: 0 8px 24px rgba(15, 23, 42, .06); padding: 36px 40px;
    animation: fadeUp .45s ease-out;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  .brand { text-align: center; margin-bottom: 26px; }
  .brand img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; box-shadow: 0 4px 14px rgba(99, 102, 241, .28); margin-bottom: 12px; }
  .brand h1 { font-size: 21px; font-weight: 700; letter-spacing: 1px; }
  .brand p { margin-top: 4px; font-size: 13px; color: var(--text-3); letter-spacing: .3px; }
  .form-group { margin-bottom: 16px; }
  label { display: block; font-size: 13px; font-weight: 500; color: var(--text-2); margin-bottom: 6px; }
  input {
    width: 100%; padding: 11px 14px; font-size: 14px;
    border: 1px solid var(--border); border-radius: 10px;
    background: #fff; color: var(--text-1);
    transition: border-color .15s, box-shadow .15s;
  }
  input::placeholder { color: var(--text-3); }
  input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99, 102, 241, .12); }
  .submit-btn {
    width: 100%; margin-top: 6px; padding: 12px; border: none; border-radius: 10px;
    background: var(--primary); color: #fff; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: background .15s, transform .15s, box-shadow .15s;
  }
  .submit-btn:hover { background: var(--primary-hover); transform: translateY(-1px); box-shadow: 0 6px 16px rgba(99, 102, 241, .25); }
  .footer { margin-top: 26px; padding-top: 14px; border-top: 1px solid var(--border); text-align: center; font-size: 12px; color: var(--text-3); }
</style>
</head>
<body>
<svg class="threads" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <g fill="none" stroke-linecap="round">
    <path d="M-60 640 C 260 560, 520 720, 860 640 S 1300 540, 1500 620" stroke="#6366f1" stroke-width="1.5" opacity=".10"/>
    <path d="M-60 668 C 260 588, 520 748, 860 668 S 1300 568, 1500 648" stroke="#6366f1" stroke-width="1.5" opacity=".08"/>
    <path d="M-60 696 C 260 616, 520 776, 860 696 S 1300 596, 1500 676" stroke="#818cf8" stroke-width="1.5" opacity=".07"/>
    <path d="M-60 724 C 260 644, 520 804, 860 724 S 1300 624, 1500 704" stroke="#a78bfa" stroke-width="1.5" opacity=".06"/>
    <path d="M-60 752 C 260 672, 520 832, 860 752 S 1300 652, 1500 732" stroke="#a855f7" stroke-width="1.5" opacity=".05"/>
    <path d="M900 -40 C 1000 160, 1200 120, 1500 220" stroke="#6366f1" stroke-width="1.5" opacity=".07"/>
    <path d="M960 -60 C 1060 140, 1260 100, 1560 200" stroke="#a78bfa" stroke-width="1.5" opacity=".06"/>
    <path d="M1020 -80 C 1120 120, 1320 80, 1620 180" stroke="#a855f7" stroke-width="1.5" opacity=".05"/>
  </g>
</svg>
<header class="app-header">
  <div class="left">
    <img src="../../../spring-ai-loom-agent/src/main/resources/META-INF/resources/static/logo.png" alt="灵梭 logo">
    <span class="title">灵梭</span>
  </div>
  <div class="right">Spring AI LoomAgent</div>
</header>
<main class="main">
  <div class="login-card">
    <div class="brand">
      <img src="../../../spring-ai-loom-agent/src/main/resources/META-INF/resources/static/logo.png" alt="灵梭 logo">
      <h1>灵梭</h1>
      <p>Spring AI LoomAgent</p>
    </div>
    <form autocomplete="off">
      <div class="form-group">
        <label for="username">用户名</label>
        <input type="text" id="username" placeholder="请输入用户名" autofocus>
      </div>
      <div class="form-group">
        <label for="password">密码</label>
        <input type="password" id="password" placeholder="请输入密码">
      </div>
      <button type="submit" class="submit-btn">登录</button>
    </form>
    <div class="footer">一线一梭 · 织就智能</div>
  </div>
</main>
</body>
</html>
