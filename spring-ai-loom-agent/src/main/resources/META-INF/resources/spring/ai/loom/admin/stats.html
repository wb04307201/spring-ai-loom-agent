<!doctype html>
<html lang="zh-CN">
  <head>
    <title>日志 - 灵梭管理控制台</title>
    <meta name="description" content="灵梭管理控制台 — 月度 Token 用量(提问卡片日志见 user.html)" />
    <link rel="icon" type="image/png" href="/static/logo.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/spring/ai/loom/style.css" />
    <link rel="stylesheet" href="console.css" />
  </head>
  <body>
    <div class="admin-layout">
      <aside class="admin-sidebar">
        <div class="admin-sidebar-header">
          <h2 class="admin-sidebar-title">管理控制台</h2>
          <span class="admin-sidebar-subtitle"
            >用户 · 角色 · 技能 · MCP · 知识库</span
          >
        </div>
        <nav class="admin-sidebar-nav">
          <a href="console.html" class="admin-sidebar-link"
            ><span class="admin-sidebar-icon">📊</span><span>用户管理</span></a
          >
          <a href="roles.html" class="admin-sidebar-link"
            ><span class="admin-sidebar-icon">🛡</span><span>角色管理</span></a
          >
          <a href="market-skills.html" class="admin-sidebar-link"
            ><span class="admin-sidebar-icon">🏪</span><span>技能市场</span></a
          >
          <a href="knowledge-market.html" class="admin-sidebar-link"
            ><span class="admin-sidebar-icon">📚</span
            ><span>知识库市场</span></a
          >
          <a href="mcps.html" class="admin-sidebar-link"
            ><span class="admin-sidebar-icon">🔧</span
            ><span>MCP 描述维护</span></a
          >
          <a href="stats.html" class="admin-sidebar-link active"
            ><span class="admin-sidebar-icon">📈</span><span>日志</span></a
          >
          <div class="admin-sidebar-divider"></div>
          <a href="/spring/ai/loom/index.html" class="admin-sidebar-link"
            ><span class="admin-sidebar-icon">⬅</span><span>返回主页</span></a
          >
        </nav>
      </aside>
      <div class="admin-main-wrap">
        <header class="admin-header">
          <div class="admin-header-left">
            <h1>日志</h1>
            <span class="admin-subtitle">Token 用量统计 · 用户对话日志</span>
          </div>
          <div class="admin-header-right">
            <span id="admin-username" class="admin-username"></span>
          </div>
        </header>

        <main class="admin-main">
          <!-- 2026-10-07: 拆成两个 tab。
               原「日志」页只有 token 统计，而「用户列表 → 会话 → 对话流水」
               这条审计链路藏在用户管理页里 —— 归位到这里。 -->
          <div class="admin-tabs" role="tablist">
            <button class="admin-tab active" data-tab="usage" role="tab"
                    aria-selected="true">Token 用量</button>
            <button class="admin-tab" data-tab="conversations" role="tab"
                    aria-selected="false">对话日志</button>
          </div>

          <!-- Tab 1: Token 用量 -->
          <section id="tab-usage" class="admin-tab-panel">
          <div class="admin-toolbar">
            <label
              style="
                font-size: 13px;
                color: var(--text-muted);
                display: inline-flex;
                align-items: center;
                gap: 4px;
              "
            >
              年：<input
                type="number"
                id="year-input"
                style="
                  width: 80px;
                  padding: 6px 8px;
                  border: 1px solid var(--border-color);
                  border-radius: 4px;
                "
              />
              月：<input
                type="number"
                id="month-input"
                min="1"
                max="12"
                style="
                  width: 60px;
                  padding: 6px 8px;
                  border: 1px solid var(--border-color);
                  border-radius: 4px;
                "
              />
            </label>
            <button
              id="reload-btn"
              class="primary-btn"
              style="padding: 6px 12px"
            >
              查询
            </button>
            <button id="refresh-btn" class="secondary-btn">刷新</button>
          </div>

          <div class="stats-card">
            <h3
              style="
                margin: 0 0 16px 0;
                font-size: 14px;
                color: var(--text-muted);
                font-weight: 500;
              "
              id="month-label"
            >
              当月用量
            </h3>
            <div class="bar-chart" id="bar-chart">
              <div class="empty-state">加载中...</div>
            </div>
          </div>

          <div id="stats-table" class="table-container">
            <div class="loading-indicator">加载中...</div>
          </div>
          </section>

          <!-- Tab 2: 对话日志（用户列表 → 会话 → 对话流水） -->
          <section id="tab-conversations" class="admin-tab-panel" style="display: none">
            <p class="tab-hint">
              点击用户名查看该用户的会话列表，再点会话进入对话流水（含工具调用与思考过程）。
            </p>
            <div class="admin-toolbar">
              <button id="conv-refresh-btn" class="secondary-btn">刷新</button>
            </div>
            <div id="conv-user-table" class="table-container">
              <div class="loading-indicator">加载中...</div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <script src="stats.js"></script>
  </body>
</html>
