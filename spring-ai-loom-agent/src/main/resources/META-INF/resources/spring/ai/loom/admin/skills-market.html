<!doctype html>
<html lang="zh-CN">
  <head>
    <title>技能市场 - 灵梭管理控制台</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/spring/ai/loom/style.css" />
    <link rel="stylesheet" href="console.css" />
  </head>
  <body>
    <div class="admin-layout">
      <aside class="admin-sidebar">
        <div class="admin-sidebar-header">
          <h2 class="admin-sidebar-title">管理控制台</h2>
          <span class="admin-sidebar-subtitle"
            >用户 · 角色 · 技能 · MCP · 知识库</span
          >
        </div>
        <nav class="admin-sidebar-nav">
          <a href="console.html" class="admin-sidebar-link"
            ><span class="admin-sidebar-icon">📊</span><span>用户管理</span></a
          >
          <a href="roles.html" class="admin-sidebar-link"
            ><span class="admin-sidebar-icon">🛡</span><span>角色管理</span></a
          >
          <a href="skills-market.html" class="admin-sidebar-link active"
            ><span class="admin-sidebar-icon">🏪</span><span>技能市场</span></a
          >
          <a href="knowledge-market.html" class="admin-sidebar-link"
            ><span class="admin-sidebar-icon">📚</span
            ><span>知识库市场</span></a
          >
          <a href="mcps.html" class="admin-sidebar-link"
            ><span class="admin-sidebar-icon">🔧</span
            ><span>MCP 描述维护</span></a
          >
          <a href="stats.html" class="admin-sidebar-link"
            ><span class="admin-sidebar-icon">📈</span><span>日志</span></a
          >
          <div class="admin-sidebar-divider"></div>
          <a href="/spring/ai/loom/index.html" class="admin-sidebar-link"
            ><span class="admin-sidebar-icon">⬅</span><span>返回主页</span></a
          >
        </nav>
      </aside>
      <div class="admin-main-wrap">
        <header class="admin-header">
          <div class="admin-header-left">
            <h1>技能市场</h1>
            <span class="admin-subtitle">编辑 / 下架市场技能（不再新建）</span>
          </div>
          <div class="admin-header-right">
            <span id="admin-username" class="admin-username"></span>
          </div>
        </header>

        <main class="admin-main">
          <div
            style="
              background: #eff6ff;
              border: 1px solid #bfdbfe;
              color: #1e40af;
              padding: 10px 16px;
              border-radius: 6px;
              font-size: 12px;
              line-height: 1.6;
              margin-bottom: 12px;
            "
          >
            <strong>admin 职责</strong> —— 仅负责<strong>编辑 / 下架</strong
            >市场技能。 不在控制台新建技能（技能一律从聊天界面「共享」Tab
            由作者本人发布到市场；admin 不应越权代为创作）。
            起无审批流：作者提交即上架；下架会自动级联清理所有拉取者副本。
          </div>

          <div class="admin-toolbar">
            <button id="refresh-btn" class="secondary-btn">刷新</button>
          </div>

          <div id="skill-table-container" class="table-container">
            <div class="loading-indicator">加载中...</div>
          </div>
        </main>
      </div>
    </div>

    <!-- 编辑技能模态框（仅编辑现有技能，不再用于新建） -->
    <div id="edit-skill-modal" class="modal-overlay" style="display: none">
      <div class="modal-content" style="max-width: 720px; max-height: 85vh">
        <div class="modal-header">
          <h3 id="edit-skill-title">编辑技能</h3>
          <div class="close-button" id="edit-skill-close">&times;</div>
        </div>
        <div
          class="modal-body"
          style="padding: 24px 32px; overflow-y: auto; max-height: 70vh"
        >
          <div class="form-group">
            <label
              >技能名称 <span style="color: var(--error-color)">*</span></label
            >
            <input
              type="text"
              id="es-name"
              class="form-input"
              placeholder="例如：周报生成"
              disabled
            />
          </div>
          <div class="form-group">
            <label>描述</label>
            <input
              type="text"
              id="es-desc"
              class="form-input"
              placeholder="简要描述功能"
            />
          </div>
          <div class="form-group">
            <label
              >内容（Prompt 模板）
              <span style="color: var(--error-color)">*</span></label
            >
            <textarea
              id="es-content"
              class="form-input"
              rows="14"
              style="
                font-family: var(--font-mono, monospace);
                font-size: 12px;
                line-height: 1.6;
              "
              placeholder="支持 {param} 占位符"
            ></textarea>
          </div>
          <div id="es-error" class="error-msg" style="display: none"></div>
        </div>
        <div class="modal-footer">
          <button class="secondary-btn" id="es-cancel">取消</button>
          <button class="primary-btn" id="es-save">保存</button>
        </div>
      </div>
    </div>

    <!-- 去掉审批拒绝备注 modal -->

    <!-- 通用确认 -->
    <div id="confirm-modal" class="modal-overlay" style="display: none">
      <div class="modal-content" style="max-width: 440px">
        <div class="modal-header">
          <h3 id="confirm-title">确认</h3>
          <div class="close-button" id="confirm-close">&times;</div>
        </div>
        <div class="modal-body" style="padding: 24px 32px">
          <div
            id="confirm-message"
            style="font-size: 14px; line-height: 1.7"
          ></div>
        </div>
        <div class="modal-footer">
          <button class="secondary-btn" id="confirm-cancel">取消</button>
          <button
            class="primary-btn"
            id="confirm-ok"
            style="
              background: var(--error-color, #ef4444);
              border-color: var(--error-color, #ef4444);
            "
          >
            确定
          </button>
        </div>
      </div>
    </div>

    <div id="toast-notification" class="toast"></div>

    <script src="skills-market.js"></script>
  </body>
</html>
