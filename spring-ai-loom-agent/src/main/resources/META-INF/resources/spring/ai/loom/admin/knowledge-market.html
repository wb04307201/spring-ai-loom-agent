<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <title>知识库市场 - 灵梭管理控制台</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/spring/ai/loom/style.css">
    <link rel="stylesheet" href="console.css">
</head>
<body>
<div class="admin-layout">
    <aside class="admin-sidebar">
        <div class="admin-sidebar-header">
            <h2 class="admin-sidebar-title">管理控制台</h2>
            <span class="admin-sidebar-subtitle">用户 · 角色 · 技能 · MCP · 知识库</span>
        </div>
        <nav class="admin-sidebar-nav">
            <a href="console.html" class="admin-sidebar-link"><span class="admin-sidebar-icon">📊</span><span>用户管理</span></a>
            <a href="roles.html" class="admin-sidebar-link"><span class="admin-sidebar-icon">🛡</span><span>角色管理</span></a>
            <a href="skills-market.html" class="admin-sidebar-link"><span class="admin-sidebar-icon">🏪</span><span>技能市场</span></a>
            <a href="knowledge-market.html" class="admin-sidebar-link active"><span class="admin-sidebar-icon">📚</span><span>知识库市场</span></a>
            <a href="mcps.html" class="admin-sidebar-link"><span class="admin-sidebar-icon">🔧</span><span>MCP 描述维护</span></a>
            <a href="stats.html" class="admin-sidebar-link"><span class="admin-sidebar-icon">📈</span><span>日志</span></a>
            <div class="admin-sidebar-divider"></div>
            <a href="/spring/ai/loom/index.html" class="admin-sidebar-link"><span class="admin-sidebar-icon">⬅</span><span>返回主页</span></a>
        </nav>
    </aside>
    <div class="admin-main-wrap">
        <header class="admin-header">
            <div class="admin-header-left">
                <h1>知识库市场</h1>
                <span class="admin-subtitle">审批用户提交的知识库 + 直接 CRUD 市场知识库</span>
            </div>
            <div class="admin-header-right">
                <span id="admin-username" class="admin-username"></span>
            </div>
        </header>

        <main class="admin-main">
            <div style="background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; padding: 10px 16px; border-radius: 6px; font-size: 12px; line-height: 1.6; margin-bottom: 12px;">
                <strong>admin 特权</strong> —— 可直接新增 / 编辑 / 删除市场知识库（绕过审批，立即生效），也可审批其他用户的 PENDING 提交。
                任何用户在知识空间点击 🔗 按钮提交的知识库都需要先在这里审批通过。
            </div>

            <div class="admin-toolbar">
                <button id="new-knowledge-btn" class="primary-btn">+ 新建知识库</button>
                <button id="refresh-btn" class="secondary-btn">刷新</button>
                <span style="margin-left: auto; font-size: 12px; color: var(--text-muted);" id="pending-count-label"></span>
            </div>

            <div id="knowledge-table-container" class="table-container">
                <div class="loading-indicator">加载中...</div>
            </div>
        </main>
    </div>
</div>

<!-- 编辑/新建知识库模态框 -->
<div id="edit-knowledge-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content" style="max-width: 560px;">
        <div class="modal-header">
            <h3 id="edit-knowledge-title">新建知识库</h3>
            <div class="close-button" id="edit-knowledge-close">&times;</div>
        </div>
        <div class="modal-body" style="padding: 24px 32px;">
            <div class="form-group">
                <label>名称 <span style="color: var(--error-color);">*</span></label>
                <input type="text" id="ek-name" class="form-input" placeholder="知识库名称">
            </div>
            <div class="form-group">
                <label>描述</label>
                <textarea id="ek-description" class="form-input" rows="3" placeholder="可选"></textarea>
            </div>
            <div class="form-group">
                <label>内容 <span style="color: var(--error-color);">*</span></label>
                <textarea id="ek-content" class="form-input" rows="4" placeholder="知识库内容（文本 / classpath: 路径）"></textarea>
            </div>
            <div class="form-group">
                <label>版本</label>
                <input type="text" id="ek-version" class="form-input" placeholder="1.0.0" value="1.0.0">
            </div>
            <div class="form-group">
                <label>状态</label>
                <select id="ek-status" class="form-input">
                    <option value="APPROVED">APPROVED（已审批）</option>
                    <option value="PENDING">PENDING（待审批）</option>
                    <option value="REJECTED">REJECTED（已拒绝）</option>
                </select>
            </div>
            <div id="edit-knowledge-error" class="error-msg" style="display: none;"></div>
        </div>
        <div class="modal-footer">
            <button class="secondary-btn" id="edit-knowledge-cancel">取消</button>
            <button class="primary-btn" id="edit-knowledge-submit">保存</button>
        </div>
    </div>
</div>

<!-- 通用确认模态框 -->
<div id="confirm-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content" style="max-width: 440px;">
        <div class="modal-header">
            <h3 id="confirm-title">确认</h3>
            <div class="close-button" id="confirm-close">&times;</div>
        </div>
        <div class="modal-body" style="padding: 24px 32px;">
            <div id="confirm-message" style="font-size: 14px; line-height: 1.7;"></div>
        </div>
        <div class="modal-footer">
            <button class="secondary-btn" id="confirm-cancel">取消</button>
            <button class="primary-btn" id="confirm-ok" style="background: var(--error-color, #ef4444); border-color: var(--error-color, #ef4444);">确定</button>
        </div>
    </div>
</div>

<!-- Toast -->
<div id="toast-notification" class="toast"></div>

<script src="knowledge-market.js"></script>
</body>
</html>
