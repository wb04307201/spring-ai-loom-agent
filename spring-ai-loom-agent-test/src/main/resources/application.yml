spring:
  datasource:
      # 库文件位置：与 loom-agent 的本地 state 同根 — 都在 $user.home/.loom/。
      # 这样 `rm -rf ~/.loom/` 一条命令就能清掉所有用户本地状态（库、向量索引、上传、临时工作区）。
      url: jdbc:h2:file:${user.home}/.loom/datasource/db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
      username: sa
      password: 123456
  flyway:
    validate-on-migrate: false
    encoding: UTF-8
  h2:
    console:
      enabled: true
  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
#    openai:
#      api-key: ${DASHSCOPE_API_KEY}
#      chat:
#        options:
#          model: qwen3.7-plus
#          enable_thinking: true
#          stream-options:
#            include_usage: true
#      embedding:
#        options:
#          model: text-embedding-v4
#      base-url: https://ws-xn7i8blnbtowo2im.cn-beijing.maas.aliyuncs.com/compatible-mode
#    zhipuai:
#      api-key: ${ZHIPUAI_API_KEY}
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        enabled: false  # 禁用 DashScope ChatModel，只用 Anthropic
      embedding:
        options:
          model: text-embedding-v4
    anthropic:
      api-key: ${NEW_API_KEY}
      base-url: http://123.56.128.32:3000
      chat:
        options:
          model: qwen3.7-plus
    #    ollama:
#      chat:
#        options:
#          model: qwen3
#      embedding:
#        options:
#          model: qwen3-embedding
#      base-url: http://localhost:11434
#    vectorstore:
#      redis:
#        initialize-schema: true
#        index-name: custom-index
#        prefix: custom-prefix
#      qdrant:
#        host: localhost
#        port: 6334
##        collection-name: custom-collection-name
#        collection-name: qwen-collection-name
    mcp:
      client:
        enabled: false
        request-timeout: 60s
        stdio:
          servers-configuration: classpath:mcp-servers.json
    loom:
      agent:
        # 单点 git / maven 工具默认 disabled —— 编译/部署请走 ICompileAndDeployTool（始终 enabled）。
        # 需要时显式开启：
        #   git: { enabled: true }   # 暴露 28 个 git 命令
        #   maven: { enabled: true } # 暴露 6 个 mvn 命令
        #
        # 可选：Maven 工具配置（enabled=true 后才生效）
        # mavenHome 可省略，工具会自动从 MAVEN_HOME / M2_HOME 环境变量或
        # Windows 常见路径 (C:\developer\apache-maven-*, C:\Program Files\Apache Maven 等) 探测。
        # 自动探测会避开系统 PATH 上损坏的 mvn 包装脚本（如 npm 全局 mvn）。
        # 若自动探测失败，再显式配置：
        #   maven:
        #     enabled: true
        #     mavenHome: C:\developer\apache-maven-3.9.16
        #     localRepository: C:\Users\wb043\.m2\repository
        #     maxOutputLines: 200
        #     defaultTimeoutMs: 300000
        # 子任务：主对话把一段任务委派给"子模型"同步执行（子任务无法再启子任务/定时器）
        subtask:
          enabled: true
          max-concurrent: 4
          max-history: 200
        # 定时任务：LLM 创建的定时器，触发时以子任务方式运行（间隔/存活上限见 flex.schedule.limits）
        schedule:
          enabled: true
        rag:
          similarityThreshold: 0.50
          top-k: 4
        # mcp 元数据已迁移到数据库（V5__add_roles_and_mcp_metadata.sql 默认种子 + admin 控制台可改）
        # skills 已迁移到数据库（V10__skill_market.sql 默认 seed 6 个 system skill + admin 控制台管理市场）
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
#  data:
#    redis:
#      host: localhost
#      port: 9379
#      password: 123456

# flex-schedule: 定时任务触发间隔/存活上限（strict = 超限抛异常）
flex:
  schedule:
    pool-size: 8
    limits:
      min-interval: 10m
      max-lifetime: 72h
      mode: strict

logging:
  level:
    org:
      springframework:
        ai: DEBUG

server:
  port: 8080