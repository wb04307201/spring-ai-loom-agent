#        prefix: custom-prefix
#      qdrant:
#        host: localhost
#        port: 6334
##        collection-name: custom-collection-name
#        collection-name: qwen-collection-name
    mcp:
      client:
        stdio:
          servers-configuration: classpath:mcp-servers.json
    loom:
      agent:
        # HTTP 调用工具(embedded IHttpTool)。DefaultHttpTool:43 **硬编码**
        # failClosed=true,且 HttpProperty.allowedDomains 默认 List.of()
        # ⇒ 白名单空集时一切 invokeEndpoint 返回 DomainNotAllowed。
        # profile 的 allowedDomains 打不开这个闸(只能收紧已配置的全局集),
        # 所以这是唯一开关。
        # 纯 host 模式 port-agnostic(DomainWhitelist.allows 无端口分支),
        # 无需写 :443。⚠️ 这是本 test app 的演示配置,生产部署须按需收紧。
        http:
          allowed-domains:
            - jsonplaceholder.typicode.com
        # 单点 git / maven 工具默认 disabled —— 编译/部署请走 ICompileAndDeployTool（始终 enabled）。
        # 需要时显式开启：
        #   git: { enabled: true }   # 暴露 28 个 git 命令
        #   maven: { enabled: true } # 暴露 6 个 mvn 命令
        #
        # 可选：Maven 工具配置（enabled=true 后才生效）
        # mavenHome 可省略，工具会自动从 MAVEN_HOME / M2_HOME 环境变量或
        # Windows 常见路径 (C:\developer\apache-maven-*, C:\Program Files\Apache Maven 等) 探测。
        # 自动探测会避开系统 PATH 上损坏的 mvn 包装脚本（如 npm 全局 mvn）。
        # 若自动探测失败，再显式配置：
        #   maven:
        #     enabled: true
        #     mavenHome: C:\developer\apache-maven-3.9.16
        #     localRepository: C:\Users\wb043\.m2\repository
        #     maxOutputLines: 200
        #     defaultTimeoutMs: 300000
        # 子任务：主对话把一段任务委派给"子模型"同步执行（子任务无法再启子任务/定时器）
        subtask:
          enabled: true
          max-concurrent: 4
          max-history: 200
          # 2026-09-30 (sub-task 性能优化): 默认超时 600s → 300s。
          # Phase 2 并行化后(Bing 12 个月并行)实际耗时 1-1.5 分钟,
          # 5 分钟足够覆盖;若 sub-task 真的卡 5 分钟,说明下游 LLM/网络出严重问题,
          # 早点 fail 反馈比静默 10 分钟更好。仍可通过 spring.ai.loom.agent.subtask.timeout-seconds 调高。
          timeout-seconds: 300
        # 定时任务：LLM 创建的定时器，触发时以子任务方式运行（间隔/存活上限见 flex.schedule.limits）
        schedule:
          enabled: true
        rag:
          similarityThreshold: 0.50
          top-k: 4
        # mcp 元数据已迁移到数据库（V5__add_roles_and_mcp_metadata.sql 默认种子 + admin 控制台可改）
        # skills 已迁移到数据库（V10__skill_market.sql 默认 seed 6 个 system skill + admin 控制台管理市场）
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
#  data:
#    redis:
#      host: localhost
#      port: 9379
#      password: 123456

# flex-schedule: 定时任务触发间隔/存活上限（strict = 超限抛异常）
flex:
  schedule:
    pool-size: 8
    limits:
      min-interval: 10m
      max-lifetime: 72h
      mode: strict

logging:
  level:
    org:
      springframework:
        ai: DEBUG

server:
  port: 8080
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json,image/svg+xml
    min-response-size: 2048