spring:
  datasource:
      # 库文件位置：与 loom-agent 的本地 state 同根 — 都在 $user.home/.loom/。
      # 这样 `rm -rf ~/.loom/` 一条命令就能清掉所有用户本地状态（库、向量索引、上传、临时工作区）。
      url: jdbc:h2:file:${user.home}/.loom/datasource/db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
      username: sa
      password: 123456
  flyway:
    validate-on-migrate: false
    encoding: UTF-8
  h2:
    console:
      enabled: true
  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
    # 2026-11-07: 私人 new-api 中转（转发阿里百炼 Qwen）。Spring AI OpenAI starter 走
    # /chat/completions 端点（参考百炼「OpenAI 兼容-Chat Completions」文档，非 Responses API）。
    openai:
      api-key: ${NEW_API_KEY}
      # 中转站会追加 /chat/completions；实测流式 + reasoning_content + 末帧 usage 正常
      base-url: http://123.56.128.32:3000/v1
      # 2026-11-09: Spring AI 2.0.2 已修 per-request timeout 覆盖陷阱(#6837:未设时
      # OpenAiChatOptions.timeout 为 null=继承 client 配置,autoconfig 注入 resolved
      # timeout)。本显式键 = client 级 callTimeout 唯一配置入口,库侧 BFPP
      # (spring.ai.loom.agent.chat.timeout-seconds,默认 600)在未显式配置时兜底。
      timeout: 600s
      chat:
        options:
          model: qwen3.8-max
          # ⚠️ OpenAI ChatCompletions 规范字段是 max_completion_tokens（Spring AI 键名
          # max-completion-tokens）；用户原写的 max_output_tokens 是 DashScope 原生/Anthropic
          # 风格键，OpenAiChatOptions 无此字段会被静默忽略 → 不生效。
          max-completion-tokens: 983616
          # OpenAI 标准：让最后一帧带 token 用量 → loom_chat_usage 落库（ChatUsageRecordingAdvisor）。
          # Spring AI 2.0.1 的 Options 无 stream-usage setter，必须用 stream-options.include-usage。
          stream-options:
            include-usage: true
          # enable_thinking 不是 OpenAiChatOptions 字段（直接写会被静默忽略），
          # 必须经 extra-body 原样透传给中转站/百炼。实测中转站接受该顶层参数。
          extra-body:
            enable_thinking: true
    # 中转站模型列表无任何 embedding 模型（只有 chat 模型）→ 显式关闭 embedding，
    # 让 RAG 向量链优雅降级（VectorStore 不建、知识上传 503、前端隐藏📚知识空间），
    # 而不是用默认 text-embedding-ada-002 打到中转站 404。
    # ⚠️ 两个键缺一不可（2026-11-07 实测）：
    #   embedding=none      —— Spring AI 2.0.1 OpenAi embedding autoconfig 的真开关
    #                          （@ConditionalOnProperty(spring.ai.model.embedding, havingValue=openai,
    #                            matchIfMissing=true)；它不读 .text 子键）
    #   embedding.text=none —— loom EmbeddingModelAvailableCondition 第 2 步判据
    #                          （noMatch → 不建 h2VectorStore）；只设它会被第 1 步
    #                          "EmbeddingModel bean 定义已在场" 抢先 match、向量照建
    model:
      embedding: none
      embedding.text: none
    mcp:
      client:
        stdio:
          servers-configuration: classpath:mcp-servers.json
    loom:
      agent:
        # HTTP 调用工具(embedded IHttpTool)。DefaultHttpTool:43 **硬编码**
        # failClosed=true,且 HttpProperty.allowedDomains 默认 List.of()
        # ⇒ 白名单空集时一切 invokeEndpoint 返回 DomainNotAllowed。
        # profile 的 allowedDomains 打不开这个闸(只能收紧已配置的全局集),
        # 所以这是唯一开关。
        # 纯 host 模式 port-agnostic(DomainWhitelist.allows 无端口分支),
        # 无需写 :443。⚠️ 这是本 test app 的演示配置,生产部署须按需收紧。
        http:
          allowed-domains:
            - jsonplaceholder.typicode.com
        # 单点 git / maven 工具默认 disabled —— 编译/部署请走 ICompileAndDeployTool（始终 enabled）。
        # 需要时显式开启：
        #   git: { enabled: true }   # 暴露 28 个 git 命令
        #   maven: { enabled: true } # 暴露 6 个 mvn 命令
        #
        # 可选：Maven 工具配置（enabled=true 后才生效）
        # mavenHome 可省略，工具会自动从 MAVEN_HOME / M2_HOME 环境变量或
        # Windows 常见路径 (C:\developer\apache-maven-*, C:\Program Files\Apache Maven 等) 探测。
        # 自动探测会避开系统 PATH 上损坏的 mvn 包装脚本（如 npm 全局 mvn）。
        # 若自动探测失败，再显式配置：
        #   maven:
        #     enabled: true
        #     mavenHome: C:\developer\apache-maven-3.9.16
        #     localRepository: C:\Users\wb043\.m2\repository
        #     maxOutputLines: 200
        #     defaultTimeoutMs: 300000
        # 子任务：主对话把一段任务委派给"子模型"同步执行（子任务无法再启子任务/定时器）
        subtask:
          enabled: true
          max-concurrent: 4
          max-history: 200
          # 2026-09-30 (sub-task 性能优化): 默认超时 600s → 300s。
          # Phase 2 并行化后(Bing 12 个月并行)实际耗时 1-1.5 分钟,
          # 5 分钟足够覆盖;若 sub-task 真的卡 5 分钟,说明下游 LLM/网络出严重问题,
          # 早点 fail 反馈比静默 10 分钟更好。仍可通过 spring.ai.loom.agent.subtask.timeout-seconds 调高。
          timeout-seconds: 300
        # 定时任务：LLM 创建的定时器，触发时以子任务方式运行（间隔/存活上限见 flex.schedule.limits）
        schedule:
          enabled: true
        rag:
          similarityThreshold: 0.50
          top-k: 4
        # mcp 元数据已迁移到数据库（V5__add_roles_and_mcp_metadata.sql 默认种子 + admin 控制台可改）
        # skills 已迁移到数据库（V10__skill_market.sql 默认 seed 6 个 system skill + admin 控制台管理市场）
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
#  data:
#    redis:
#      host: localhost
#      port: 9379
#      password: 123456

# flex-schedule: 定时任务触发间隔/存活上限（strict = 超限抛异常）
flex:
  schedule:
    pool-size: 8
    limits:
      min-interval: 10m
      max-lifetime: 72h
      mode: strict

# 2026-11-07: 关掉 test app 的 4 维 fake EmbeddingModel（TestAnthropicOptionsConfig），
# 与上方 spring.ai.model.embedding=none 配合实现真·无 embedding 部署形态（RAG 链关闭、
# 知识空间按钮隐藏）。IT 用 test yml 不读此键，默认 true 不受影响。
loom:
  test:
    fake-embedding:
      enabled: false

logging:
  level:
    org:
      springframework:
        ai: DEBUG

server:
  port: 8080
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json,image/svg+xml
    min-response-size: 2048