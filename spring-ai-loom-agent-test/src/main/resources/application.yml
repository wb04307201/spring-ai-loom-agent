#      # DashScope (Alibaba Cloud Bailian) Anthropic-compatible endpoint. Set
#      # DASHSCOPE_PERSON_TOKEN_API_KEY in the run environment; the key is *not* committed.
#      api-key: ${DASHSCOPE_PERSON_TOKEN_API_KEY}
#      base-url: https://ws-xn7i8blnbtowo2im.cn-beijing.maas.aliyuncs.com/apps/anthropic
#      # 2026-09-30 (sub-task 流稳定性修复): Spring AI Anthropic 默认 timeout=60s,
#      # 流式 sub-task 跑 12 个月 Bing 搜索时 200+ 秒,到 60s okhttp3 主动发
#      # RST_STREAM CANCEL 中断流(底层是 HTTP/2 stream was reset: CANCEL)。
#      # 提高到 10 分钟配合 sub-task timeout-seconds=300 一起工作。
#      timeout: 600s
#      chat:
#        options:
#          model: qwen3.8-max
#          multi_model: true
#          enable_thinking: true
    openai:
      # 2026-10-01: 切到 MiniMax OpenAI 兼容 Chat Completions 端点(测试流式 thinking)。
      # MiniMax-M3 模型:OpenAI 兼容 API 默认 enable thinking(文档: "OpenAI-compatible
      # requests enable it when omitted");用 thinking.type=enabled 显式声明。
      # streaming usage:stream_options.include_usage=true 让最后一帧带 token 用量。
      # 见 https://platform.minimax.io/docs/api-reference/text-chat-openai
      api-key: ${MINIMAX_API_KEY}
      # 国际版端点(用户也可用 https://api.minimaxi.com/v1 — 同 API 不同域);
      # Spring AI OpenAI SDK 自动追加 /chat/completions。
      base-url: https://api.minimaxi.com/v1
      chat:
        options:
          model: MiniMax-M3
          # 2026-10-01 防流截断:thinking + tool_use 联用容易撞默认 token 上限,
          # 未闭合的 tool_use JSON → 流末尾 JsonEOFException。OpenAI ChatCompletions
          # 用 max_completion_tokens(老字段 max_tokens 已被 OpenAI 弃用);Anthropic SDK
          # 用 max_tokens。
          # MiniMax 官方推荐值:M3 系列 131072 (128K),上限 524288 (512K);其他模型 65536 (64K),上限 200K。
          # 文档原话:"如果生成因 length 原因中断,请尝试调高此值"——直接设到推荐上限最稳。
          max-completion-tokens: 131072
          # extra-body 塞 MiniMax 特有参数:
          # - thinking.type=enabled:OpenAI 兼容路径下显式打开 thinking(默认 on,显式更清晰)
          # - reasoning_split=true:思考内容走 reasoning_details 字段(开发者友好的
          #   分离式结构,免去 prefix/extract 后处理);MiniMax 官方推荐 Interleaved
          #   Thinking 场景配这个参数。
          extra-body:
            thinking:
              type: adaptive
            reasoning_split: true
          # OpenAI 标准 stream_options 让最后一帧带 token 用量 → loom_chat_usage 落库
          stream-usage: true
#    anthropic:
#      # MiniMax Anthropic-compatible endpoint (Spring AI 2.0 official recommendation for MiniMax).
#      # API key must be provided via env var ANTHROPIC_API_KEY — never commit a real key.
#      api-key: ${ANTHROPIC_API_KEY}
#      # Use the same .com host Claude Code is configured with (the .cn host has a separate
#      # TLS chain with a stricter cert path that's expired).
