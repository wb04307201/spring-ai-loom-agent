spring:
  datasource:
    url: jdbc:h2:file:./target/test-ds/db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
  ai:
    openai:
      # 2026-11-24: 切回 MiniMax（与 main yml 同步;参考 platform.minimax.cn/docs/api-reference/text-chat-openai）。
      # 切换方式:注释/解注释下方两个块。历史:2026-11-07 曾因 MiniMax 余额耗尽切到
      # 私人 new-api 中转（转发阿里百炼 Qwen）;实测中转站流式/reasoning_content/usage 全正常。
      api-key: ${MINIMAX_API_KEY}
      base-url: https://api.minimaxi.com/v1
      chat:
        options:
          model: MiniMax-M3.1-Flash
          max-completion-tokens: 131072
          # Spring AI 2.0.1 的 yml 绑定面没有 stream-usage setter（旧键被静默忽略），
          # 必须用 stream-options.include-usage 让末帧带 token 用量。
          stream-options:
            include-usage: true
          # MiniMax thinking 开关经 extra-body 透传:adaptive 自适应 + reasoning_split 分离思考。
          extra-body:
            thinking:
              type: adaptive
            reasoning_split: true
      # ===== new-api 中装备份（切回时:注释上方 MiniMax 的 api-key/base-url/chat,解注释本块）=====
      # api-key: ${NEW_API_KEY}
      # base-url: http://123.56.128.32:3000/v1
      # chat:
      #   options:
      #     model: qwen4-max
      #     max-completion-tokens: 983616
      #     stream-options:
      #       include-usage: true
      #     # qwen 的 thinking 开关不是 OpenAiChatOptions 字段，经 extra-body 透传到请求体顶层。
      #     extra-body:
      #       enable_thinking: true
    loom:
      agent:
        http:
          # embedded HTTP 工具在 DefaultHttpTool:43 **硬编码** failClosed=true,
          # 且 HttpProperty.allowedDomains 默认 List.of() ⇒ 白名单空集时
          # InvokeService 的 fail-closed 分支直接返回空白名单,拒绝一切。
          # profile 的 allowedDomains 打不开这个闸(它只能收紧已配置的全局集),
          # 所以这是唯一能让真实对话里 invokeEndpoint 跑通的开关。
          #
          # 纯 host 模式是 port-agnostic 的(DomainWhitelist.allows 的无端口分支),
          # 故无需写 :443 —— 一次放行该域名的任意端口。
          #
          # 仅测试配置;主库与 HttpProperty 的默认值不变(fail-closed 是 SSRF 防护
          # 的部署级闸门,刻意不打开)。
          allowed-domains:
            - jsonplaceholder.typicode.com
loom:
  agent:
    datasource-dir: ./target/test-ds
    users-base-path: ./target/test-users
server:
  port: 0
logging:
  level:
    org:
      springframework:
        ai: DEBUG