spring:
  datasource:
    url: jdbc:h2:file:./target/test-ds/db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
  ai:
    openai:
      api-key: ${MINIMAX_API_KEY}
      base-url: https://api.minimaxi.com/v1
      chat:
        options:
          model: MiniMax-M3
          max-completion-tokens: 131072
          extra-body:
            thinking:
              type: adaptive
            reasoning_split: true
          stream-usage: true
loom:
  agent:
    datasource-dir: ./target/test-ds
    users-base-path: ./target/test-users
server:
  port: 0
logging:
  level:
    org:
      springframework:
        ai: DEBUG